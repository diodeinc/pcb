[project]
name = "pcb-scripts"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = ["click>=8.5.1"]

[dependency-groups]
dev = [{ include-group = "test" }, "ruff>=0.17.4", "ty>=0.0.97"]
test = ["pytest>=9.2.0", "hypothesis>=6.168.5"]

[tool.ruff]
# KiCad embeds Python 3.9; requires-python describes only the dev/test environment.
target-version = "py39"

[tool.ruff.lint]
# Enforce required-imports (not enabled by default).
extend-select = ["I002"]

[tool.ruff.lint.isort]
# Defer annotation evaluation so modern type syntax is safe under KiCad's Python.
required-imports = ["from __future__ import annotations"]

[tool.ty.src]
exclude = ["**/tests/"]

[tool.ty.rules]
# Disable unresolved-import: ty can't resolve relative imports in non-package scripts
unresolved-import = "ignore"
