caches:
  - name: windows_rust
    cache_key:
      - windows-rust
      - agent: pipeline
      - agent: os
      - agent: arch
      - checksum:
          - rust-toolchain.toml
          - .buildkite/test-windows.ps1
        fallback_limit: true
      - checksum: Cargo.lock
    target_paths:
      - ~/.cargo/bin
      - ~/.cargo/registry
      - ~/.cargo/git
      - ~/.rustup
      - target
