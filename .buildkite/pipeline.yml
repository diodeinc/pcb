# Independent native jobs; Cargo, uv and the Nix toolchain persist on each pfet worker.
agents:
  queue: pfet

steps:
  - label: ":mag: Source checks"
    key: source
    if: build.branch != pipeline.default_branch
    if_changed:
      - crates/**
      - Cargo.{toml,lock}
      - .cargo/**
      - rust-toolchain{,.toml}
      - "{rustfmt,.rustfmt}.toml"
      - README.md
      - examples/**
      - bin/embed-readme
      - flake.{nix,lock}
      - .buildkite/**
    timeout_in_minutes: 1
    command: &source-checks |
      set -euo pipefail

      # Neither check compiles Rust or needs KiCad.
      cargo fmt --all -- --check
      bin/embed-readme --check README.md

  - label: ":mag: Source checks"
    key: source-main
    if: build.branch == pipeline.default_branch
    timeout_in_minutes: 1
    command: *source-checks

  - label: ":rust: Workspace lint"
    key: lint
    if: build.branch != pipeline.default_branch
    if_changed:
      - crates/**
      - lib/std/**
      - Cargo.{toml,lock}
      - .cargo/**
      - rust-toolchain{,.toml}
      - "{clippy,.clippy}.toml"
      - "**/.gitignore"
      - "**/.ignore"
      - flake.{nix,lock}
      - .buildkite/**
    timeout_in_minutes: 10
    command: &lint-checks |
      set -euo pipefail

      # Compile-dependent checks stay separate from the fast source checks; no KiCad needed.
      cargo run --locked -p pcbc -- fmt --check lib/std
      cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  - label: ":rust: Workspace lint"
    key: lint-main
    if: build.branch == pipeline.default_branch
    timeout_in_minutes: 10
    command: *lint-checks

  - label: ":rust: Workspace tests"
    key: tests
    if: build.branch != pipeline.default_branch
    if_changed:
      - crates/**
      - lib/**
      - examples/**
      - test-workspaces/**
      - Cargo.{toml,lock}
      - .cargo/**
      - rust-toolchain{,.toml}
      - .config/nextest.toml
      - flake.{nix,lock}
      - .buildkite/**
    timeout_in_minutes: 20
    env: &test-env
      CARGO_INCREMENTAL: "0"
      RUST_LOG: debug
      RUST_BACKTRACE: full
    command: &rust-tests |
      set -euo pipefail

      # Snapshot normalization expects the conventional Linux temporary directory.
      export TMPDIR=/tmp
      # The persistent Cargo target lives outside the checkout; binaries need stdlib beside them.
      mkdir -p "${CARGO_TARGET_DIR:-target}"
      ln -sfn "$PWD/lib" "${CARGO_TARGET_DIR:-target}/lib"
      cargo nextest run --locked --workspace --profile ci
      cargo test --locked --workspace --doc

      # Keep the library-only build contract without rerunning the same tests.
      cargo check --locked --lib --no-default-features -p pcb-step -p pcb-ipc2581-tools
    artifact_paths: target/nextest/ci/junit.xml

  # if + if_changed is AND; always check the default branch.
  - label: ":rust: Workspace tests"
    key: tests-main
    if: build.branch == pipeline.default_branch
    timeout_in_minutes: 20
    env: *test-env
    command: *rust-tests
    artifact_paths: target/nextest/ci/junit.xml

  - label: ":python: Python checks"
    key: python
    if: build.branch != pipeline.default_branch
    if_changed:
      - "**/*.{py,pyi}"
      - bin/pcb-build-perf
      - pyproject.toml
      - "{ruff,.ruff,ty}.toml"
      - uv.lock
      - install.sh
      - flake.{nix,lock}
      - .buildkite/**
    timeout_in_minutes: 3
    command: &python-checks |
      set -euo pipefail

      # Ruff and ty are native tools pinned by flake.lock; uv owns the test environment.
      uv sync --locked --no-default-groups --group test
      ty check
      ruff check crates/pcb-layout/src/scripts
      ruff format --check crates/pcb-layout/src/scripts

      # Pure Python coverage; native pcbnew tests remain in the KiCad-equipped jobs.
      uv run --no-sync pytest bin/tests crates/pcb-layout/src/scripts/lens/tests \
        --junitxml=target/pytest/junit.xml
    artifact_paths: target/pytest/junit.xml

  - label: ":python: Python checks"
    key: python-main
    if: build.branch == pipeline.default_branch
    timeout_in_minutes: 3
    command: *python-checks
    artifact_paths: target/pytest/junit.xml
