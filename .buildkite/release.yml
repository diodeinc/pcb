# Stable and nightly pcb-release pipeline; signed by the existing pfet uploader.
agents:
  queue: pfet

env:
  BUILDKITE_NIX_SHELL: ""

steps:
  - block: Release PCB
    key: release-input
    if: build.env("PCB_RELEASE_CHANNEL") != "nightly"
    fields:
      - select: Product
        key: release-product
        options:
          - label: Compiler (pcbc)
            value: compiler
          - label: Shim and launcher (pcb)
            value: shim
      - text: Version (without a v prefix)
        key: release-version
        hint: SemVer, for example 0.5.0 or 0.5.0-rc.1
      - select: Dry run
        key: release-dry-run
        default: "true"
        options:
          - label: Build and verify only; no GitHub or S3 writes
            value: "true"
          - label: Publish and tag
            value: "false"

  - label: Prepare release commit
    key: prepare-release
    agents: {queue: pcb-release}
    depends_on: release-input
    timeout_in_minutes: 10
    concurrency_group: pcb-release-prepare
    concurrency: 1
    command: |
      set -euo pipefail
      if [[ "${PCB_RELEASE_CHANNEL:-}" == nightly ]]; then
        args=(--nightly)
        if [[ "${PCB_RELEASE_DRY_RUN:-false}" == true ]]; then
          args+=(--dry-run)
        fi
        nix develop .#release --command python3 bin/pcb-release.py prepare "${args[@]}"
      else
        nix develop .#release --command python3 bin/pcb-release.py prepare
      fi

  # Only the uploader holds the signing key; unchanged nightlies allocate no builders.
  - label: Upload release builds
    key: upload-release
    depends_on: prepare-release
    agents: {queue: pfet-upload}
    timeout_in_minutes: 2
    command: |
      set -euo pipefail
      if [[ "$(buildkite-agent meta-data get release-should-build)" == true ]]; then
        buildkite-agent pipeline upload --no-interpolation .buildkite/release-builds.yml
      fi
