# Nextest configuration
# https://nexte.st/docs/configuration/reference/

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
status-level = "skip"

# Start the longest tests first.
[[profile.default.overrides]]
filter = '''
test(test_publish_board_full) |
(binary_id(pcbc::integration) & test(/^(import|dfm)::/)) |
test(test_testcase1_full)
'''
priority = 100
