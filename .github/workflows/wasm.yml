name: WASM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wasm:
    name: Evaluate publish bundles
    runs-on: blacksmith-16vcpu-ubuntu-2404
    container:
      image: debian:trixie-slim
      options: --user root
    timeout-minutes: 30
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y ca-certificates curl build-essential pkg-config libssl-dev jq git openssh-client zstd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install KiCad from the Diode APT repository
        run: |
          install -m 0644 .github/diode-kicad-archive-keyring.asc /usr/share/keyrings/diode-kicad-archive-keyring.asc
          echo "deb [signed-by=/usr/share/keyrings/diode-kicad-archive-keyring.asc] https://kicad-mirror.api.diode.computer/apt trixie main" \
            > /etc/apt/sources.list.d/diode-kicad.list
          apt-get update
          apt-get install -y --no-install-recommends kicad

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: wasm32-unknown-unknown
          cache-bin: false

      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: wasm-pack@0.15.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Build pcbc
        run: cargo build --release -p pcbc --bin pcbc

      - name: Prepare stdlib artifact
        run: tar -C lib/std -cf - . | zstd -q -3 -c > "$RUNNER_TEMP/stdlib.tar.zst"

      # wasm-opt dominates the bundle build and only matters for published
      # packages; the size gate below still bounds the unoptimized bundle.
      - name: Build WASM bundle
        run: ./bin/build-wasm-bundle.sh zen --no-opt

      - name: Check WASM artifact size
        run: |
          WASM_FILE="target/wasm-bundle/pcb_zen_wasm_bg.wasm"

          if [ ! -f "$WASM_FILE" ]; then
            echo "Error: WASM artifact not found"
            exit 1
          fi

          # Get file size in bytes
          SIZE=$(stat -c%s "$WASM_FILE" 2>/dev/null || stat -f%z "$WASM_FILE")
          SIZE_MB=$((SIZE / 1024 / 1024))

          echo "WASM bundle size: ${SIZE_MB}MB"
          ls -lh "$WASM_FILE"

          # Fail if size exceeds 30MB
          if [ $SIZE -gt 31457280 ]; then
            echo "Error: WASM bundle is too large (${SIZE_MB}MB > 30MB)"
            exit 1
          fi

          echo "WASM bundle size is within limits."

      - name: Checkout board workspaces
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          DIODE_CLIENT_ID: ${{ secrets.DIODE_CLIENT_ID }}
          DIODE_CLIENT_SECRET: ${{ secrets.DIODE_CLIENT_SECRET }}
        run: .github/scripts/clone-diodehub.sh demo/b/Demeter demo/b/Feign

      - name: Evaluate publish bundles with WASM
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          for board in Demeter Feign; do
            node crates/pcb-zen-wasm/scripts/eval-publish-bundle.mjs \
              --publish "workspaces/$board/$board.zen" \
              --pcbc target/release/pcbc \
              --stdlib "$RUNNER_TEMP/stdlib.tar.zst" \
              > "$RUNNER_TEMP/$board-wasm-netlist.json"
          done
