name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.config.name }})
    runs-on: ${{ matrix.config.runs-on }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            runs-on: blacksmith-16vcpu-windows-2025
          - name: macOS
            runs-on: blacksmith-6vcpu-macos-15
    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Remove unused Homebrew taps (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew update
          brew list --formula --full-name | while IFS= read -r formula; do
            case "$formula" in
              aws/tap/*|azure/bicep/*) brew uninstall --formula --force "$formula" ;;
            esac
          done
          for tap in aws/tap azure/bicep; do
            if brew tap | grep -qx "$tap"; then
              brew untap "$tap"
            fi
          done

      - name: Resolve KiCad cask version (macOS)
        if: contains(matrix.config.name, 'macOS')
        id: kicad-cask
        run: echo "version=$(brew info --cask --json=v2 kicad | jq -r '.casks[0].version')" >> "$GITHUB_OUTPUT"

      - name: Cache KiCad (macOS)
        if: contains(matrix.config.name, 'macOS')
        id: cache-kicad-mac
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /Applications/KiCad
          key: ${{ runner.os }}-kicad-${{ steps.kicad-cask.outputs.version }}

      - name: Install KiCad (macOS)
        if: contains(matrix.config.name, 'macOS') && steps.cache-kicad-mac.outputs.cache-hit != 'true'
        run: |
          brew uninstall --cask kicad 2>/dev/null || true
          rm -rf /Applications/KiCad 2>/dev/null || true
          brew install --cask kicad

      - name: Install Rust (Windows)
        if: runner.os == 'Windows'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ""
          cache-bin: false

      - name: Install Rust
        if: runner.os != 'Windows'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-bin: false

      - name: Install nextest
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: nextest

      - name: Test All (Workspace)
        env:
          RUST_LOG: debug
          RUST_BACKTRACE: full
        run: cargo nextest run --workspace --profile ci --locked
