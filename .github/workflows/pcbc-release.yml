# EXPERIMENT BRANCH ONLY: parameterized pcbc release build for timing
# comparisons. The publish job is removed, so this never releases anything.
name: Release pcbc

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'unused tag, kept for compatibility'
        required: false
        type: string
      dry_run:
        description: 'unused, always dry'
        required: false
        type: boolean
        default: true
      lto:
        description: 'profile.dist lto (fat, thin, off)'
        required: false
        type: string
        default: fat
      codegen_units:
        description: 'profile.dist codegen-units'
        required: false
        type: string
        default: '1'
      single_cargo:
        description: 'Build pcbc and pcb-rectify in one cargo invocation'
        required: false
        type: boolean
        default: false
      cross_arm:
        description: 'Cross-compile aarch64 Linux targets on x64 with cargo-zigbuild'
        required: false
        type: boolean
        default: false
      cross_windows:
        description: 'Cross-compile x86_64-pc-windows-msvc on Linux x64 with cargo-xwin'
        required: false
        type: boolean
        default: false
      big_runners:
        description: 'Use 32 vCPU Linux/Windows and 12 vCPU macOS runners'
        required: false
        type: boolean
        default: false
      label:
        description: 'Experiment label'
        required: false
        type: string
        default: ''

run-name: 'release-exp ${{ inputs.label }} lto=${{ inputs.lto }} cgu=${{ inputs.codegen_units }} single=${{ inputs.single_cargo }} cross_arm=${{ inputs.cross_arm }} big=${{ inputs.big_runners }}'

permissions:
  contents: read

jobs:
  build:
    name: build pcbc (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: ${{ inputs.big_runners && 'blacksmith-12vcpu-macos-15' || 'blacksmith-6vcpu-macos-15' }}
          - target: aarch64-unknown-linux-gnu
            runner: ${{ inputs.cross_arm && (inputs.big_runners && 'blacksmith-32vcpu-ubuntu-2404' || 'blacksmith-16vcpu-ubuntu-2404') || (inputs.big_runners && 'blacksmith-32vcpu-ubuntu-2404-arm' || 'blacksmith-16vcpu-ubuntu-2404-arm') }}
          - target: aarch64-unknown-linux-musl
            runner: ${{ inputs.cross_arm && (inputs.big_runners && 'blacksmith-32vcpu-ubuntu-2404' || 'blacksmith-16vcpu-ubuntu-2404') || (inputs.big_runners && 'blacksmith-32vcpu-ubuntu-2404-arm' || 'blacksmith-16vcpu-ubuntu-2404-arm') }}
          - target: x86_64-unknown-linux-gnu
            runner: ${{ inputs.big_runners && 'blacksmith-32vcpu-ubuntu-2404' || 'blacksmith-16vcpu-ubuntu-2404' }}
          - target: x86_64-unknown-linux-musl
            runner: ${{ inputs.big_runners && 'blacksmith-32vcpu-ubuntu-2404' || 'blacksmith-16vcpu-ubuntu-2404' }}
          - target: x86_64-pc-windows-msvc
            runner: ${{ inputs.cross_windows && (inputs.big_runners && 'blacksmith-32vcpu-ubuntu-2404' || 'blacksmith-16vcpu-ubuntu-2404') || (inputs.big_runners && 'blacksmith-32vcpu-windows-2025' || 'blacksmith-16vcpu-windows-2025') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CARGO_PROFILE_DIST_LTO: ${{ inputs.lto }}
      CARGO_PROFILE_DIST_CODEGEN_UNITS: ${{ inputs.codegen_units }}
      SINGLE_CARGO: ${{ inputs.single_cargo }}
      CROSS: ${{ inputs.cross_arm && contains(matrix.target, 'aarch64-unknown-linux') }}
      XWIN: ${{ inputs.cross_windows && contains(matrix.target, 'windows') }}
    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-bin: false
          cache: false
          rustflags: ""
          target: ${{ matrix.target }}

      - name: Install Linux musl build dependencies
        if: contains(matrix.target, 'linux-musl') && env.CROSS != 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev

      - name: Install cargo-zigbuild
        if: env.CROSS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/zb"
          "$RUNNER_TEMP/zb/bin/pip" install -q ziglang cargo-zigbuild
          echo "$RUNNER_TEMP/zb/bin" >> "$GITHUB_PATH"

      - name: Install cargo-xwin
        if: env.XWIN == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The MSVC STL headers require clang >= 19.
          sudo apt-get update
          sudo apt-get install -y clang-19 lld-19 llvm-19
          echo "/usr/lib/llvm-19/bin" >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/xw"
          "$RUNNER_TEMP/xw/bin/pip" install -q cargo-xwin
          echo "$RUNNER_TEMP/xw/bin" >> "$GITHUB_PATH"

      - name: Install zstd
        shell: bash
        run: |
          set -euo pipefail
          if command -v zstd >/dev/null; then
            exit 0
          fi
          case "${{ runner.os }}" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y zstd
              ;;
            macOS)
              brew install zstd
              ;;
            Windows)
              choco install zstandard -y
              ;;
          esac

      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo_cmd=(cargo build)
          if [[ "$XWIN" == "true" ]]; then
            cargo_cmd=(cargo xwin build)
          elif [[ "$CROSS" == "true" ]]; then
            cargo_cmd=(cargo zigbuild)
            if [[ "$TARGET" == *linux-musl ]]; then
              export CFLAGS="-Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int32_t=uint32_t -Du_int64_t=uint64_t"
            fi
          elif [[ "$TARGET" == *linux-musl ]]; then
            export CC=musl-gcc
            export RUSTFLAGS="-C linker=musl-gcc"
            export CFLAGS="-Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int32_t=uint32_t -Du_int64_t=uint64_t"
          fi
          start=$(date +%s)
          if [[ "$SINGLE_CARGO" == "true" ]]; then
            "${cargo_cmd[@]}" --profile dist -p pcbc --bin pcbc -p rectify --bin pcb-rectify --target "$TARGET"
          else
            "${cargo_cmd[@]}" --profile dist -p pcbc --bin pcbc --target "$TARGET"
            "${cargo_cmd[@]}" --profile dist -p rectify --bin pcb-rectify --target "$TARGET"
          fi
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))"

      - name: Prepare artifacts
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for bin in pcbc pcb-rectify; do
            exe="$bin"
            artifact="$bin-$TARGET"
            if [[ "$TARGET" == *windows* ]]; then
              exe="$bin.exe"
              artifact="$artifact.exe"
            fi
            cp "target/$TARGET/dist/$exe" "artifacts/$artifact"
            zstd -q -f -3 "artifacts/$artifact" -o "artifacts/$artifact.zst"
          done
          ls -l artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pcbc-${{ matrix.target }}
          path: artifacts/*
          retention-days: 3

  smoke-windows:
    if: inputs.cross_windows
    needs: build
    runs-on: blacksmith-4vcpu-windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            lib/std

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pcbc-x86_64-pc-windows-msvc
          path: artifacts

      - name: Run cross-compiled pcbc
        shell: bash
        run: |
          set -euxo pipefail
          cp artifacts/pcbc-x86_64-pc-windows-msvc.exe pcbc.exe
          ./pcbc.exe --version
          git clone -q --depth 1 https://code.diode.computer/demo/b/DM0002.git
          cd DM0002
          ../pcbc.exe build -S bom
