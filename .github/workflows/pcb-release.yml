name: Release pcb shim

on:
  push:
    tags:
      - 'pcb/v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'pcb shim release tag, such as pcb/v0.1.0'
        required: true
        type: string
      dry_run:
        description: 'Build artifacts without publishing to S3'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.dry_run && github.ref_name || inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-bin: false
          cache: false

      - id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          case "$tag" in
            pcb/v*) version="${tag#pcb/v}" ;;
            *) echo "Unsupported pcb shim release tag: $tag" >&2; exit 1 ;;
          esac

          actual=$(cargo metadata --no-deps --format-version=1 \
            | jq -r '.packages[] | select(.name == "pcb") | .version')
          if [ "$actual" != "$version" ]; then
            echo "pcb version is $actual, but tag requests $version" >&2
            exit 1
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: build pcb (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: blacksmith-6vcpu-macos-15
          - target: aarch64-unknown-linux-gnu
            runner: blacksmith-16vcpu-ubuntu-2404-arm
          - target: aarch64-unknown-linux-musl
            runner: blacksmith-16vcpu-ubuntu-2404-arm
          - target: x86_64-unknown-linux-gnu
            runner: blacksmith-16vcpu-ubuntu-2404
          - target: x86_64-unknown-linux-musl
            runner: blacksmith-16vcpu-ubuntu-2404
          - target: x86_64-pc-windows-msvc
            runner: blacksmith-16vcpu-windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.dry_run && github.ref_name || needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-bin: false
          cache: false
          rustflags: ""
          target: ${{ matrix.target }}

      - name: Install Linux musl build dependencies
        if: contains(matrix.target, 'linux-musl')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev

      - name: Install zstd
        shell: bash
        run: |
          set -euo pipefail
          if command -v zstd >/dev/null; then
            exit 0
          fi
          case "${{ runner.os }}" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y zstd
              ;;
            macOS)
              brew install zstd
              ;;
            Windows)
              choco install zstandard -y
              ;;
          esac

      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" == *linux-musl ]]; then
            export CC=musl-gcc
            export RUSTFLAGS="-C linker=musl-gcc"
            export CFLAGS="-Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int32_t=uint32_t -Du_int64_t=uint64_t"
          fi
          cargo build --profile dist -p pcb --bin pcb --target "$TARGET"
          cargo build --profile dist -p pcb-launcher --bin pcb-launcher --target "$TARGET"

      - name: Prepare artifacts
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for binary in pcb pcb-launcher; do
            exe="$binary"
            artifact="$binary-$TARGET"
            if [[ "$TARGET" == *windows* ]]; then
              exe="$exe.exe"
              artifact="$artifact.exe"
            fi
            cp "target/$TARGET/dist/$exe" "artifacts/$artifact"
            zstd -q -f -3 "artifacts/$artifact" -o "artifacts/$artifact.zst"
            if command -v shasum >/dev/null; then
              shasum -a 256 "artifacts/$artifact" > "artifacts/$artifact.sha256"
            else
              sha256sum "artifacts/$artifact" > "artifacts/$artifact.sha256"
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pcb-${{ matrix.target }}
          path: artifacts/*

  publish:
    needs:
      - prepare
      - build
    runs-on: blacksmith-16vcpu-ubuntu-2404
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.dry_run && github.ref_name || needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pcb-*
          path: artifacts
          merge-multiple: true

      - name: Configure AWS credentials
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PCB_RELEASE_S3_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload artifacts to S3
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        run: |
          aws s3 sync artifacts/ "s3://diode-pcb-releases/pcb/$RELEASE_TAG/" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Publish latest shim metadata
        if: ${{ needs.prepare.outputs.prerelease == 'false' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) }}
        run: |
          base_url="https://pcb.api.diode.computer/pcb/$RELEASE_TAG"
          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg tag "$RELEASE_TAG" \
            --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg base_url "$base_url" \
            '{ version: $version, tag: $tag, published_at: $published_at, base_url: $base_url }' > pcb-latest.json
          aws s3 cp pcb-latest.json "s3://diode-pcb-releases/pcb/pcb-latest.json" \
            --cache-control "public, max-age=60" \
            --content-type "application/json"
