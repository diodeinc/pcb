name: Publish to npm

on:
  push:
    tags:
      # Only publish the top-level PCB npm package from top-level PCB release tags.
      # Crate-specific tags like crate/ipc2581/v0.3.0 are used for crates.io
      # publishing and must not trigger npm publishing.
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          cache-bin: false
      - uses: taiki-e/install-action@wasm-pack
      - name: Build WASM bundle
        run: ./bin/build-wasm-bundle.sh
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: target/wasm-bundle

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: target/wasm-bundle
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish to npm
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" == *-* ]]; then
            npm publish --access public --tag next --provenance
          else
            npm publish --access public --provenance
          fi
        working-directory: target/wasm-bundle
