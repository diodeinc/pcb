name: Set up KiCad on macOS
description: Cache the current Homebrew KiCad cask and install it on a cache miss.

runs:
  using: composite
  steps:
    - name: Remove unused Homebrew taps
      shell: bash
      run: |
        brew update
        brew list --formula --full-name | while IFS= read -r formula; do
          case "$formula" in
            aws/tap/*|azure/bicep/*) brew uninstall --formula --force "$formula" ;;
          esac
        done
        for tap in aws/tap azure/bicep; do
          if brew tap | grep -qx "$tap"; then
            brew untap "$tap"
          fi
        done

    - name: Resolve KiCad cask version
      id: kicad-cask
      shell: bash
      run: echo "version=$(brew info --cask --json=v2 kicad | jq -r '.casks[0].version')" >> "$GITHUB_OUTPUT"

    - name: Cache KiCad
      id: cache-kicad-mac
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /Applications/KiCad
        key: ${{ runner.os }}-kicad-${{ steps.kicad-cask.outputs.version }}

    - name: Install KiCad
      if: steps.cache-kicad-mac.outputs.cache-hit != 'true'
      shell: bash
      run: |
        brew uninstall --cask kicad 2>/dev/null || true
        rm -rf /Applications/KiCad 2>/dev/null || true
        brew install --cask kicad
