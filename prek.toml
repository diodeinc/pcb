#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "local"
hooks = [
  {
    id = "ty",
    name = "ty (Python type checker)",
    entry = "uv run --locked ty check",
    language = "system",
    types = ["python"],
    pass_filenames = false,
    priority = 0
  },
  {
    id = "cargo-fmt",
    name = "cargo fmt",
    entry = "cargo fmt --all",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    priority = 0
  },
  {
    id = "clippy",
    name = "clippy",
    entry = "cargo clippy --workspace --all-targets --all-features -- -D warnings",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    priority = 1
  },
  {
    id = "pcb-fmt-stdlib",
    name = "pcb fmt stdlib",
    entry = "cargo run -p pcbc -- fmt lib/std",
    language = "system",
    files = '^lib/std/.*\.zen$',
    pass_filenames = false,
    priority = 1
  }
]
