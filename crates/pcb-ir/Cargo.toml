[package]
name = "pcb-ir"
version = "0.3.82"
edition.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Intermediate representations, geometry passes, and renderers for PCB fabrication data"
license = "MIT OR Apache-2.0"
keywords = ["pcb", "gerber", "ipc-2581", "geometry", "eda"]
categories = ["graphics", "rendering", "hardware-support"]

[dev-dependencies]
pcb-sexpr = { workspace = true }

[dependencies]
anyhow = { workspace = true }
boostvoronoi = { workspace = true }
i_overlay = { workspace = true }
ipc2581 = { workspace = true }
kurbo = { workspace = true }
resvg = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
base64 = { workspace = true }
terminal_size = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true }
