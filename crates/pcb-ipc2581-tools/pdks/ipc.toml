schema_version = 2
default_profile = "2b"

[pdk]
id = "diode-ipc-informed-baselines"
name = "Diode opinionated IPC-informed DFM baselines"
revision = "2026-09-01"
manufacturer = "Diode"
process = "Partial IPC-informed baseline"

[sources.ipc-design-topics]
title = "IPC design and manufacturing profile topics"
url = "https://www.electronics.org/design-manufacturing-confirmed-ipc-standards"
accessed = "2026-09-01"
note = "IPC public material identifies the class/producibility taxonomy and relevant design topics. Diode chose the numeric baseline values in this PDK; they are not licensed IPC numeric matrices, do not establish full IPC compliance, and do not imply IPC certification."

[sources.diode-standard]
title = "Diode standard PDK baselines"
url = "https://github.com/diodeinc/pcb/blob/c8254cb36eab64e4c82f1b1cce23eb82e72b2b83/crates/pcb-ipc2581-tools/pdks/standard.toml"
note = "Adopted thresholds are general-purpose Diode baselines from standard.toml, not IPC requirements or technology- and copper-weight-qualified manufacturing capabilities. Coverage remains partial."

[profiles.1a]
name = "IPC Class 1 / Producibility Level A — Diode partial baseline"
description = "Diode's opinionated partial baseline informed by IPC design topics; not an IPC numeric matrix, certification, or proof of full IPC compliance."
performance_class = 1
producibility_level = "A"
technologies = ["rigid", "flex", "rigid_flex", "hdi"]
coverage = ["Diode baseline: maximum via aspect ratio", "Diode baseline: maximum PTH aspect ratio", "Diode baseline: via, PTH, and NPTH hole-to-copper clearance at 0.25 mm", "Diode baseline: via, PTH, NPTH, plated-slot, and nonplated-slot board-edge clearance at 0.50 mm", "Diode standard baseline: minimum final copper feature width at 5 mil (0.127 mm) on every copper layer", "Diode standard baseline: distinct-conductor copper spacing at 5 mil (0.127 mm)"]
source = "ipc-design-topics"

[profiles.1a.defaults]
board_thickness = "1.6 mm"

