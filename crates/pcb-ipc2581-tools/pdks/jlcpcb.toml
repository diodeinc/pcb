schema_version = 2
default_profile = "one-ounce"

[pdk]
id = "jlcpcb-rigid-fr4"
name = "JLCPCB rigid FR-4"
revision = "stackup-templates-2026-10-28"
manufacturer = "JLCPCB"
process = "Rigid FR-4, 1 oz or 2 oz outer copper"

[sources.hole-pair-review-guidance]
title = "Diode hole-pair review guidance"
url = "https://github.com/diodeinc/pcb/blob/main/crates/pcb-ipc2581-tools/docs/dfm.md"
note = "The 0.45 mm mixed-hole/NPTH-pair spacing is inferred guidance, not a published JLCPCB minimum."

[sources.jlc-stackup-templates]
title = "JLCPCB stackup (impedance) templates"
url = "https://cart.jlcpcb.com/api/overseas-shop-cart/v1/shoppingCart/getImpedanceTemplateSettings"
accessed = "2026-10-28"
note = "The [[stackup_builds]] at the end of this file; regenerate them with update_jlcpcb_stackups.py."

[sources.jlc-capabilities]
title = "JLCPCB PCB Capabilities"
url = "https://jlcpcb.com/capabilities/pcb-capabilities"
accessed = "2026-10-26"
note = "Public capability table. Rules use standard service values and exclude special local BGA exceptions."

[sources.diode-mask-guidance]
title = "Diode soldermask web guidance"
url = "https://github.com/diodeinc/pcb/blob/main/crates/pcb-ipc2581-tools/docs/dfm.md"
note = "Diode prefers a 0.10 mm soldermask web as advisory guidance. Shortfalls warn, not fail; this does not certify the manufacturer's color-specific minimum, including 0.13 mm for black or white mask."

[profiles.one-ounce]
name = "1 oz rigid FR-4"
description = "Standard rigid FR-4 service with advisory 0.10 mm soldermask-web guidance."
technologies = ["rigid"]
coverage = ["2-32 copper layers", "1 oz outer copper", "standard FR-4 thicknesses 0.4-2.0 mm", "preferred soldermask web at 0.10 mm, warning only"]
source = "jlc-capabilities"

[profiles.one-ounce.defaults]
material = "FR-4"
board_thickness = "1.6 mm"
outer_copper_weight = "1 oz"
inner_copper_weight = "0.5 oz"

[profiles.one-ounce.support]
copper_layers = { minimum = 2, maximum = 32 }
outer_copper_weight = ["1 oz"]

[profiles.two-ounce]
name = "2 oz rigid FR-4"
description = "Heavy-copper rigid FR-4 service with 2 oz finished outer copper."
technologies = ["rigid"]
coverage = ["2-32 copper layers", "2 oz outer copper", "standard FR-4 thicknesses 0.4-2.0 mm", "preferred soldermask web at 0.20 mm, warning only"]
source = "jlc-capabilities"

[profiles.two-ounce.defaults]
material = "FR-4"
board_thickness = "1.6 mm"
outer_copper_weight = "2 oz"
inner_copper_weight = "0.5 oz"

[profiles.two-ounce.support]
copper_layers = { minimum = 2, maximum = 32 }
outer_copper_weight = ["2 oz"]

[[rules.drilling.hole_diameter]]
id = "jlc.drilling.minimum_via_hole_diameter"
select = { hole = "via" }
limit = { minimum = "0.15 mm", preferred = "0.20 mm" }
source = "jlc-capabilities"

[[rules.drilling.hole_diameter]]
id = "jlc.drilling.minimum_pth_hole_diameter"
select = { hole = "pth" }
limit = { minimum = "0.15 mm", preferred = "0.50 mm" }
source = "jlc-capabilities"

[[rules.drilling.hole_diameter]]
id = "jlc.drilling.minimum_npth_hole_diameter"
select = { hole = "npth" }
# Published service minimum; smaller NPTHs risk solder/mask blockage.
limit = { minimum = "0.50 mm" }
source = "jlc-capabilities"

[[rules.drilling.slot_width]]
id = "jlc.drilling.minimum_plated_slot_width"
select = { plating = "plated" }
cases = [
  { id = "2-layer", when = { copper_layers = { exact = 2 } }, limit = { minimum = "0.50 mm" } },
  { id = "multilayer", when = { copper_layers = { minimum = 3, maximum = 32 } }, limit = { minimum = "0.35 mm" } },
]
source = "jlc-capabilities"

[[rules.drilling.slot_width]]
id = "jlc.drilling.minimum_nonplated_slot_width"
select = { plating = "nonplated" }
limit = { minimum = "1.0 mm" }
source = "jlc-capabilities"

[[rules.drilling.hole_to_hole_clearance]]
id = "jlc.drilling.minimum_hole_clearance.via_via"
select = { first_hole = "via", second_hole = "via" }
limit = { minimum = "0.20 mm" }
source = "jlc-capabilities"

[[rules.drilling.hole_to_hole_clearance]]
id = "jlc.drilling.minimum_hole_clearance.via_pth"
select = { first_hole = "via", second_hole = "pth" }
limit = { preferred = "0.45 mm" }
source = "hole-pair-review-guidance"

[[rules.drilling.hole_to_hole_clearance]]
id = "jlc.drilling.minimum_hole_clearance.via_npth"
select = { first_hole = "via", second_hole = "npth" }
