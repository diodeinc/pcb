[[rules.soldermask.web]]
id = "jlc.soldermask.minimum_web"
profiles = ["one-ounce"]
limit = { preferred = "0.10 mm" }
source = "diode-mask-guidance"

[[rules.soldermask.web]]
id = "jlc.soldermask.minimum_web_2oz"
profiles = ["two-ounce"]
limit = { preferred = "0.20 mm" }
source = "jlc-capabilities"

# IPC overallThickness includes foil and soldermask, as the finished board does.
[[rules.stackup.board_thickness]]
id = "jlc.stackup.board_thickness"
limit = { nominal = ["0.4 mm", "0.6 mm", "0.8 mm", "1.0 mm", "1.2 mm", "1.6 mm", "2.0 mm"], tolerance = "0.1 mm", tolerance_percent = 10 }
source = "jlc-capabilities"

[[rules.stackup.copper_weight]]
id = "jlc.stackup.outer_copper_weight"
select = { position = "outer" }
limit = { allowed = ["1 oz", "2 oz"] }
source = "jlc-capabilities"

[[rules.stackup.copper_weight]]
id = "jlc.stackup.inner_copper_weight"
select = { position = "inner" }
limit = { allowed = ["0.5 oz", "1 oz", "2 oz"] }
source = "jlc-capabilities"

# 0.025 mm absorbs rounding and prepreg press-out variation (7628 spans
# 0.188-0.218 mm across JLC templates) but not a missing or extra ply.
[[rules.stackup.dielectric_gaps]]
id = "jlc.stackup.dielectric_gaps"
limit = { tolerance = "0.025 mm" }
source = "jlc-stackup-templates"

[[rules.board.surface_finish]]
id = "jlc.board.surface_finish"
cases = [
  { id = "up-to-5-layer", when = { copper_layers = { minimum = 2, maximum = 5 } }, limit = { allowed = ["hasl", "lead_free_hasl", "enig", "osp"] } },
  { id = "6-layer-and-up", when = { copper_layers = { minimum = 6, maximum = 32 } }, limit = { allowed = ["enig", "osp"] } },
]
source = "jlc-capabilities"

[[rules.board.soldermask_color]]
id = "jlc.board.soldermask_color"
limit = { allowed = ["green", "purple", "red", "yellow", "blue", "white", "black"] }
source = "jlc-capabilities"

[[rules.board.size]]
id = "jlc.board.size"
cases = [
  { id = "2-layer", when = { copper_layers = { exact = 2 } }, limit = { minimum = ["3 mm", "3 mm"], maximum = ["670 mm", "600 mm"] } },
  { id = "4-layer", when = { copper_layers = { minimum = 3, maximum = 5 } }, limit = { minimum = ["3 mm", "3 mm"], maximum = ["663 mm", "593 mm"] } },
  { id = "6-layer-and-up", when = { copper_layers = { minimum = 6, maximum = 32 } }, limit = { minimum = ["3 mm", "3 mm"], maximum = ["656 mm", "586 mm"] } },
]
source = "jlc-capabilities"

