# Track width and spacing depend on each layer's own finished copper weight.
[[rules.copper.feature_width]]
id = "jlc.copper.minimum_feature_width"
cases = [
  { id = "2-layer-1oz", when = { copper_layers = { exact = 2 }, copper = { position = "outer", weight = "1 oz" } }, limit = { minimum = "0.10 mm" } },
  { id = "2-layer-2oz", when = { copper_layers = { exact = 2 }, copper = { position = "outer", weight = "2 oz" } }, limit = { minimum = "0.16 mm" } },
  { id = "multilayer-outer-1oz", when = { copper_layers = { minimum = 3, maximum = 32 }, copper = { position = "outer", weight = "1 oz" } }, limit = { minimum = "0.09 mm" } },
  { id = "multilayer-outer-2oz", when = { copper_layers = { minimum = 3, maximum = 32 }, copper = { position = "outer", weight = "2 oz" } }, limit = { minimum = "0.15 mm" } },
