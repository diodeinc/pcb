schema_version = 2
default_profile = "aurora-prototype"

[pdk]
id = "apcb-proto"
name = "AdvancedPCB Aurora prototype"
revision = "draft-2026-09-01"
manufacturer = "AdvancedPCB"
process = "Aurora 2-10 layer prototype"

[profiles.aurora-prototype]
name = "Aurora 2-10 layer prototype"
technologies = ["rigid"]

[[rules.drilling.hole_diameter]]
id = "drilling.minimum_via_hole_diameter"
